<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chem-markdown Markdown example</title>

    <!-- Markdown → HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

    <!-- SmilesDrawer (needed only to draw structures in smiles: lines) -->
    <script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>

    <!-- chem-markdown library -->
    <script src="../dist/chem-markdown.js"></script>

    <style>
      body {
        font-family: sans-serif;
        line-height: 1.7;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
      }
      textarea {
        width: 100%;
        height: 220px;
        font-family: monospace;
        font-size: 14px;
        box-sizing: border-box;
      }
      #output {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 0 16px;
        margin-top: 12px;
      }
      .chem-block {
        margin: 12px 0;
        padding: 8px 12px;
        background: #f8f9fa;
        border-radius: 6px;
      }
      .chem-line {
        margin: 4px 0;
        font-size: 1.2em;
      }
      .chem-error {
        color: #c0392b;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>chem-markdown Markdown example</h1>
    <p>
      <code>```chem</code> code blocks and <code>`chem:...`</code> inline code in Markdown are rendered as
      formulas and structures. Edit the text below to re-render.
    </p>

    <textarea id="source">
## Formation of water

Hydrogen and oxygen form water `chem:H2O`.

```chem
2H2 + O2 -> 2H2O
```

## Structures

Ethanol `chem:smiles:CCO` is also written as `chem:C2H5OH`.

```chem
smiles: c1ccccc1
smiles: CC(=O)Oc1ccccc1C(=O)O
```

## Ions and equations

```chem
Ca^{2+} + 2Cl^- -> CaCl2
HCl(aq) + NaOH(aq) -> NaCl(aq) + H2O(l)
CuSO4*5H2O
```
</textarea>

    <div id="output"></div>

    <script>
      // Render after converting Markdown to HTML: turn off auto rendering and call run()
      ChemMarkdown.initialize({ startOnLoad: false });

      const source = document.getElementById("source");
      const output = document.getElementById("output");

      function render() {
        output.innerHTML = marked.parse(source.value);
        ChemMarkdown.run({ nodes: output.querySelectorAll("pre > code.language-chem, code") });
      }

      source.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
